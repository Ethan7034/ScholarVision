<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholar Vision | History (v2.0)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --primary: #00f3ff; --bg: #03050f; }
        body { background: var(--bg); color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
        .glass { background: rgba(15,23,42,.6); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.1); }
    </style>
</head>
<body class="min-h-screen p-6">

    <div class="max-w-3xl mx-auto">
        <header class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-2xl font-bold text-cyan-400 font-mono">HISTORY_LOG</h1>
                <p class="text-slate-500 text-sm mt-1">受保护页面 · 未登录访问会被网关 302 回主页</p>
            </div>
            <div class="flex gap-2">
                <a href="/" class="text-xs font-mono text-cyan-400 border border-cyan-400/30 px-3 py-1 rounded hover:bg-cyan-400/10">[ PIPELINE ]</a>
                <button onclick="handleLogout()" class="text-xs font-mono text-red-400 border border-red-400/30 px-3 py-1 rounded hover:bg-red-400/10">[ LOGOUT ]</button>
            </div>
        </header>

        <div id="who" class="glass rounded-lg px-4 py-3 mb-6 text-sm font-mono text-green-400">读取会话中...</div>
        <div id="list" class="space-y-3"></div>
    </div>

    <script>
        async function handleLogout() {
            await fetch('/auth/logout', { method: 'POST' });
            location.href = '/';
        }

        async function init() {
            const who = document.getElementById('who');
            const list = document.getElementById('list');

            const me = await fetch('/auth/me');
            if (me.status === 401) {
                // 走到这里说明会话在页面加载后过期了，主动回主页触发登录
                location.href = '/?auth=required&next=%2Fdashboard';
                return;
            }
            const user = (await me.json()).username;
            who.innerText = `SESSION ACTIVE :: ${user}`;

            const res = await fetch('/api/history');
            if (!res.ok) {
                list.innerHTML = '<div class="text-slate-500 font-mono text-sm">历史接口返回异常。</div>';
                return;
            }
            const data = await res.json();
            if (!data.items.length) {
                list.innerHTML = '<div class="text-slate-500 font-mono text-sm">尚无记录 —— 去主页上传一份 PDF。</div>';
                return;
            }
            list.innerHTML = data.items.map(item => `
                <div class="glass rounded-lg p-4">
                    <div class="text-cyan-400 font-mono text-sm break-all">${item.filename}</div>
                    <div class="text-slate-500 font-mono text-xs mt-1">${item.created_at || ''}</div>
                </div>
            `).join('');
        }

        init();
    </script>
</body>
</html>
